[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granunlearn"
version = "0.1.0"
description = "Granularity-Controlled Multimodal Unlearning"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1",
    "torchvision",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "pyarrow",
    "pandas",
    "numpy",
    "pillow",
    "pyyaml",
    "pydantic>=2.0",
    "tqdm",
    "scikit-learn",
    "pytest",
    "jsonschema",
    "safetensors",
]

[project.optional-dependencies]
qwen = [
    "qwen-vl-utils",
    "einops",
]
salmu = [
    "open-clip-torch",
    "sentence-transformers",
]
flash = [
    "flash-attn>=2.5",
]
wandb = [
    "wandb",
]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "integration: marks integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

experiment:
  name: mllmu_pilot100
  seed: 42

dataset:
  name: mllmu_hier
  # v2 (Iteration 11R): the visual split was repaired — v1 served every
  # train/val/test image query images[0], the photograph training consumed,
  # so the image route measured unseen wording over a SEEN photograph.  v2
  # reserves images[0] for training and draws val/test queries from
  # disjoint held-out photograph pools.  The training and unlearning JSONLs
  # are byte-identical between v1 and v2, so no checkpoint is retrained.
  version: pilot100_v2
  max_entities: 100
  hierarchy_types:
    - semantic
    - numeric
    - taxonomic

model:
  config: configs/models/qwen35_9b.yaml

states:
  train:
    - MF
    - MG
    - MN

methods:
  - no_op
  - unknown_target
  - generalized_sft
  - contrastive_rewrite

evaluation:
  routes:
    - text_to_text
    - image_to_text
    - image_text_to_text
  metrics:
    - fine_information_leakage
    - target_granularity_accuracy
    - under_forgetting
    - over_forgetting
    - wrong_branch
    - same_entity_retain
    - other_entity_retain

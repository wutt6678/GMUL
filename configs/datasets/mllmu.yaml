dataset:
  name: mllmu_hier
  source: MLLMU-Bench
  subset: fictitious  # no celebrity subset for MVP
  source_mode: local
  # Official Hugging Face release layout (parquet is the default format).
  # Populate via: huggingface-cli download MLLMMU/MLLMU-Bench
  #   --repo-type dataset --include "Full_Set/*" --local-dir data/raw/MLLMU-Bench
  data_root: data/raw/MLLMU-Bench
  annotations_file: Full_Set/train-00000-of-00001.parquet
  source_format: parquet
  # HF repo revision the local copy was synced from (research provenance).
  source_revision: e91a01eb060b61be8dbde7edb48b121341bd0890

  # ---- Iteration 4: deterministic hierarchy build ----
  version: det_v1
  seed: 42
  materialize_images: true
  images_dir: data/processed/mllmu_hier/images
  # one image per profile -> entity-level splits.  NOTE: this is a
  # SOURCE/DATA partition only; the unlearning evaluation query split
  # (train/val/test paraphrases over the SAME target associations) is a
  # separate dimension built in Iteration 6.
  split_mode: entity_level
  min_parse_coverage: 0.95        # real-parser coverage gate per attribute
  # Justified per-attribute override: salary failures are principled policy
  # exclusions (17 NA/N/A + 21 non-USD currencies that cannot be converted
  # deterministically), not parser weakness.  All exclusions are reported
  # in parse_coverage.json.
  min_parse_coverage_per_attribute:
    salary: 0.90
  deterministic_attributes:
    - residence
    - birthplace
    - date_of_birth
    - salary
    - height

attributes:
  eligible:
    - residence
    - birthplace
    - date_of_birth
    - occupation
    - salary
    - height
    - education
  excluded:
    - phone_number
    - email
    - physical_description

hierarchy:
  deterministic_first: true
  qwen_assisted_attributes:
    - occupation
    - education

# ---- Iteration 5: Qwen-assisted semantic hierarchies ----
qwen:
  model_id: Qwen/Qwen3.5-9B
  device: auto               # most-free GPU
  bf16: true                 # full-precision BF16 generation (Iteration 5 evidence run)
  min_proposal_confidence: 0.6
  min_verification_confidence: 0.7
  audit_sample_accepted: 10
  audit_sample_rejected: 5

query_families:
  families:
    - fine_direct
    - target_direct
    - open
    - ancestor
    - retain_same_entity
    - retain_other_entity
  paraphrases_per_query: 3

split:
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

training:
  method: lora
  num_epochs: 10
  learning_rate: 2.0e-4
  weight_decay: 0.01
  batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  max_seq_length: 512
  gradient_checkpointing: true
  freeze_vision: true
  # Train on target-level generalized facts instead of fine-grained facts

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

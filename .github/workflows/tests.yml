name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # CPU-only: tests/unit is pure (no torch/transformers/GPU).
    # Heavy GPU integration tests (tests/integration) are deliberately
    # NOT run here — they need multi-GB model checkpoints and CUDA.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because some tests re-derive claims from the repository's
          # past rather than trusting the report that states them: the 11C audit's
          # verifier-binding gap (was the unpinned verifier recoverable at the
          # scoring commit?), the 11C-5R seal (does the sealed hash really bind the
          # defective module's bytes?), and the Stage-2 repair's disclosure that
          # neither the Stage-1c nor the Stage-2 freeze records a git commit --
          # which reconstructs HEAD at each freeze's own timestamp and tests that
          # candidate against every sha256 the freeze bound.  Under the default
          # fetch-depth: 1 those commits are absent, and git reports a missing
          # COMMIT as a missing PATH — "exists on disk, but not in <sha>" — so the
          # checks failed on a clone artifact that reads like a repository fact.
          # Skipping them instead would leave the audit's central recoverability
          # claim verified nowhere but on one laptop.  History is cheap here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci-unit.txt

      - name: Install minimal unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci-unit.txt
          pip install -e . --no-deps

      - name: Run unit tests
        run: pytest tests/unit -q --maxfail=5

      - name: Verify committed report evidence loads
        # The report-integrity tests read committed JSON evidence
        # (data/reports/*.json); fail loudly if any is missing.
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          required = [
              "data/reports/salmu_official_splits.json",
              "data/reports/salmu_official_splits_r5.json",
              "data/reports/salmu_unlearning_selection.json",
              "data/reports/salmu_unlearning_selection_r5.json",
              "data/reports/salmu_reference_eval.json",
              "data/reports/salmu_reference_eval_r5.json",
              "data/reports/salmubench_official_eval_r5.json",
              "data/reports/salmu_reference_provenance_r5.json",
              "data/reports/mllmu_pilot100_reference_eval.json",
              "data/reports/mllmu_pilot100_unlearning_selection.json",
              "data/reports/mllmu_pilot100_final_evaluation.json",
              "data/reports/mllmu_pilot100_reference_provenance.json",
              # 11R1: the prediction parquets and their sidecars are
              # gitignored, so this committed manifest is the only way the
              # "all thirty sidecars verify" claim can be checked by anyone
              # without this machine's working tree.
              "data/reports/mllmu_pilot100_prediction_manifest.json",
              # Frozen sha256 of all 496 referenced images.  Without it the
              # dataset pins image paths but not photographs.
              "data/mllmu_hier_pilot100/image_manifest.json",
              "data/raw/inaturalist/pilot_v1/PROVENANCE.json",
              # 11C stage 3: the confirmation pool's fetch provenance.  The
              # 720 photographs stay gitignored, so this is the only committed
              # record of their sha256, licence, attribution, observation id
              # and source URL -- i.e. the only way anyone can check that the
              # 360 selected photographs are new and CC-licensed.
              "data/raw/inaturalist/confirm_v1/PROVENANCE.json",
              # 11C stage 3c: which 360 of the 720 drawn photographs the
              # confirmation uses, selected under the frozen hash rule.  The
              # photographs stay gitignored, so this is the committed record of
              # their sha256, licence, attribution and source URL, and the
              # evidence that none of them is exploratory media.
              "data/reports/mllmu_confirm100_photograph_selection.json",
              # 11C stage 3d: the built 1,209-query confirmation split, and
              # the evidence that the four measurable sealed invariants held
              # before anything was written and that every tolerated
              # exploratory-validator error is a named class with a reason.
              "data/reports/mllmu_confirm100_split_report.json",
              # The 402 photographs the confirmation is scored over, sealed by
              # hash: 360 selected plus the 42 exempted target-person
              # portraits, and nothing else.  This is the artifact the
              # prediction sidecars bind as dataset.image_manifest_sha256.
              "data/mllmu_hier_confirm100/image_manifest.json",
              # 11C preregistration evidence: the power analysis that sizes
              # the confirmation split and derives the retention margin.  It
              # reads the gitignored prediction parquets and photographs, so
              # the committed JSON is the only reproducible record of the
              # sizing decision.
              "data/reports/mllmu_pilot100_confirmation_power.json",
              # The confirmation protocol freeze, written before any
              # confirmation inference.  Without it in git there is no way to
              # show the parameters were fixed beforehand.
              "data/reports/mllmu_pilot100_confirmation_freeze.json",
              # 11C stage 5: the RESULT.  Absent from git until the chain
              # scored, which was itself the record that the confirmation had
              # not been run; now the primary claims, their intervals and the
              # Holm verdict.
              "data/reports/mllmu_confirm100_final_analysis.json",
              # The provenance beside each confirmation prediction file.  The
              # three parquets are committed too, and
              # test_iteration11c5_scoring.py ties each one to the sha256 the
              # report's inputs_bound pins; these six are the JSON half, so a
              # checkout missing them fails here rather than inside a test.
              "data/mllmu_hier_confirm100/predictions/predictions_B3.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B0.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_MG.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B3.generation_order.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B0.generation_order.json",
              "data/mllmu_hier_confirm100/predictions/predictions_MG.generation_order.json",
              # 11C post-run audit: what the scoring run did not record.  Filed
              # after the result was seen, marked post_hoc inside itself, and
              # binding nothing; committed so the limitation is public record.
              # The raw run logs beside it are not listed here because this step
              # json.loads every entry and they are plain text.
              "data/reports/mllmu_confirm100_execution_provenance.json",
              # Iteration 12 (exploratory).  `data/reports/*` is gitignored by
              # default, so these two need negations in .gitignore to be here
              # at all -- a frozen selection protocol that only exists in one
              # working tree is not preregistration.  The first is the fit/
              # probe partition of the retained entities; the second freezes
              # D_G's direction, its numerical tolerance and the tie-break,
              # plus the retention floor, BEFORE any candidate is trained.
              # The selection report itself is added to this list when Stage 1
              # actually runs, not before: a required file that does not exist
              # yet would fail this step on every push until then.
              "data/reports/mllmu_iter12_retention_probe.json",
              "data/reports/mllmu_iter12_selection_protocol_freeze.json",
              "data/reports/mllmu_iter12_retention_selection.json",
              "data/reports/mllmu_iter12_seed_replication_freeze.json",
              # Stage 1b's result, and the disclosure that the frozen analyzer
              # crashed on a non-decision-bearing field and a separate script
              # completed it.  The second is required beside the first because
              # a reader who found only the result would have no way to know
              # that the preregistered code did not run to completion unaided.
              "data/reports/mllmu_iter12_seed_replication.json",
              "data/reports/mllmu_iter12_seed_replication.REPAIR.json",
              # Stage 1c: the route-stratified floor.  All three are required
              # because the study trains nothing -- its whole claim is that the
              # result is reproducible from committed files, so a clone missing
              # any of them would still pass the unit tests while being unable
              # to check that claim.
              "data/reports/mllmu_iter12_route_probe.json",
              "data/reports/mllmu_iter12_route_stratification_freeze.json",
              "data/reports/mllmu_iter12_route_stratified.json",
              # The fit-half training groups.  retain.jsonl IS the frozen
              # partition, so the protocol's central claim -- that the probe
              # half was never rehearsed by any candidate -- is checkable from
              # a clone rather than taken on trust.
              "data/mllmu_hier_pilot100/unlearning_iter12/retain.jsonl",
              # Stage 2: the bounded-suppression and MF-anchor study.  The
              # calibration measured KL and NLL for the eleven adapters this
              # repository already had and is what the mechanism decision is
              # derived from; the basis records that decision; the freeze
              # hash-binds both together with the eight paths that implement
              # them.  All three are required because the freeze's own
              # --check-only reads them -- a clone missing one would fail the
              # protocol check rather than skip it.
              #
              # Stage 2 has now run, so the selection report is here too, beside
              # the repair record that qualifies it.  The selector is one of the
              # eight paths the Stage-2 freeze binds and could not be edited, so
              # it was run with two defects worked around at runtime; the second
              # of those changes `selected`, which makes the REPAIR record the
              # only place a reader can weigh that judgement.  Both are required
              # because `repair_iter12_stage2_selection.py --check-only`
              # re-derives the record from the frozen bytes and refuses without
              # it -- the same shape as Stage 1b's report and its REPAIR record.
              "data/reports/mllmu_iter12_stage2_selection.json",
              "data/reports/mllmu_iter12_stage2_selection.REPAIR.json",
              "data/reports/mllmu_iter12_anchor_calibration.json",
              "data/reports/mllmu_iter12_stage2_basis.json",
              "data/reports/mllmu_iter12_stage2_freeze.json",
              # The faithfulness control's result.  The control is what licences
              # the Stage-2 comparison at all, and it writes into
              # data/checkpoints/, which is gitignored -- so without this copy
              # the numbers behind "the two training loops agree" would exist on
              # one machine only.  It also carries the correction to a sentence
              # in the control's own report that the freeze will not let be
              # fixed where it was written.
              "data/reports/mllmu_iter12_stage2_control_reading.json",
              # The MF reference cache's sidecar.  Its 1.48 GB tensor stays
              # gitignored, but the sidecar is what makes "anchored against MF"
              # checkable from a clone rather than described: it records the
              # sha256 of the MF adapter, the base-model revision and the
              # encoding contract.  Rebuilding it needs a GPU.
              "data/mllmu_hier_pilot100/mf_reference_logprobs/sidecar.json",
              # The superseded Stage-2 control and the frozen-loop re-run that
              # explained it.  The freeze's faithfulness_control section asserts
              # a finding about these two runs, and a disclosure nobody can
              # inspect is only an assertion, so the small files are committed
              # while the 131 MB of weights each stay ignored.  They are
              # required here because reaching them needs a SCOPED gitignore
              # negation -- `!outputs/superseded/` on its own would have
              # re-included 30 superseded pilot-100 parquets parked beside
              # them, so the rule opens the directory, closes everything else
              # in it, then opens one subdirectory.  A regression in that is
              # easy to introduce and invisible until a clone is made, and this
              # turns it into "Missing committed reports" instead of a test
              # failing on an assertion about a file that is not there.
              "outputs/superseded/iter12_stage2_control_v1/control_incumbent_byte_reproduction/CONTROL.json",
              "outputs/superseded/iter12_stage2_control_v1/frozen_loop_rerun/RERUN_COMPARISON.json",
              # The earlier filings of the Stage-2 repair record, each superseded
              # when the script that writes it was corrected.  The first filed its
              # anchor proof as a null where a byte-identical reproduction belonged
              # -- the selection report carries no timestamp, so a scoring re-run
              # reproduces it byte-identically and a gate on "the sha256 moved" read
              # that as a no-op.  The second said the first was unreachable from a
              # clone when it was about to become reachable.  The filed record lists
              # both with a measured key-set diff, and `--check-only` recomputes that
              # diff from these files, so a disclosure that could not be inspected
              # would be caught here rather than trusted.  Each needs its own scoped
              # negation in .gitignore, for the reason given above.
              "outputs/superseded/mllmu_iter12_stage2_selection.REPAIR.understated-anchor-proof.json",
              "outputs/superseded/mllmu_iter12_stage2_selection.REPAIR.claimed-the-earlier-copy-was-not-committed.json",
              # The Stage-2 repair's two evidence files, required at the paths the
              # repair reads rather than copied into data/, because --check-only
              # requires the invocations embedded in the filed record to be a prefix
              # of this log and lifts the second crash's traceback out of it.  A
              # clone without them would pass those checks vacuously: an empty log
              # holds no failed invocation and no unexpected call site either.  Not
              # json.loads'd by the loop above -- neither ends in .json -- so they
              # are checked for existence only.
              "outputs/lanes/iter12_stage2_repair_evidence.jsonl",
              "outputs/lanes/iter12_stage2_nohup.log",
              # The Stage-2 chain's own logs.  iter12_stage2_chain.log is the one
              # that keeps history -- the lane script appends to it with `tee -a`
              # and `>>` -- so it is the only committed evidence that the hardened
              # SIGTERM stop path ran for real rather than only against a stub, and
              # it is where the generation phase's two timestamps come from.  The
              # other three are the per-phase logs it tails from.  None is
              # json.loads'd by the loop above.
              "outputs/lanes/iter12_stage2_chain.log",
              "outputs/lanes/iter12_stage2_gen.log",
              "outputs/lanes/iter12_stage2_score.log",
              "outputs/lanes/iter12_stage2_ctrl.log",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing committed reports: {missing}")
          for p in required:
              if p.endswith(".json"):
                  json.loads(Path(p).read_text())
          print(f"All {len(required)} committed reports present and valid JSON.")
          EOF

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # CPU-only: tests/unit is pure (no torch/transformers/GPU).
    # Heavy GPU integration tests (tests/integration) are deliberately
    # NOT run here — they need multi-GB model checkpoints and CUDA.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/ci-unit.txt

      - name: Install minimal unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci-unit.txt
          pip install -e . --no-deps

      - name: Run unit tests
        run: pytest tests/unit -q --maxfail=5

      - name: Verify committed report evidence loads
        # The report-integrity tests read committed JSON evidence
        # (data/reports/*.json); fail loudly if any is missing.
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          required = [
              "data/reports/salmu_official_splits.json",
              "data/reports/salmu_official_splits_r5.json",
              "data/reports/salmu_unlearning_selection.json",
              "data/reports/salmu_unlearning_selection_r5.json",
              "data/reports/salmu_reference_eval.json",
              "data/reports/salmu_reference_eval_r5.json",
              "data/reports/salmubench_official_eval_r5.json",
              "data/reports/salmu_reference_provenance_r5.json",
              "data/reports/mllmu_pilot100_reference_eval.json",
              "data/reports/mllmu_pilot100_unlearning_selection.json",
              "data/reports/mllmu_pilot100_final_evaluation.json",
              "data/reports/mllmu_pilot100_reference_provenance.json",
              # 11R1: the prediction parquets and their sidecars are
              # gitignored, so this committed manifest is the only way the
              # "all thirty sidecars verify" claim can be checked by anyone
              # without this machine's working tree.
              "data/reports/mllmu_pilot100_prediction_manifest.json",
              # Frozen sha256 of all 496 referenced images.  Without it the
              # dataset pins image paths but not photographs.
              "data/mllmu_hier_pilot100/image_manifest.json",
              "data/raw/inaturalist/pilot_v1/PROVENANCE.json",
              # 11C stage 3: the confirmation pool's fetch provenance.  The
              # 720 photographs stay gitignored, so this is the only committed
              # record of their sha256, licence, attribution, observation id
              # and source URL -- i.e. the only way anyone can check that the
              # 360 selected photographs are new and CC-licensed.
              "data/raw/inaturalist/confirm_v1/PROVENANCE.json",
              # 11C stage 3c: which 360 of the 720 drawn photographs the
              # confirmation uses, selected under the frozen hash rule.  The
              # photographs stay gitignored, so this is the committed record of
              # their sha256, licence, attribution and source URL, and the
              # evidence that none of them is exploratory media.
              "data/reports/mllmu_confirm100_photograph_selection.json",
              # 11C stage 3d: the built 1,209-query confirmation split, and
              # the evidence that the four measurable sealed invariants held
              # before anything was written and that every tolerated
              # exploratory-validator error is a named class with a reason.
              "data/reports/mllmu_confirm100_split_report.json",
              # The 402 photographs the confirmation is scored over, sealed by
              # hash: 360 selected plus the 42 exempted target-person
              # portraits, and nothing else.  This is the artifact the
              # prediction sidecars bind as dataset.image_manifest_sha256.
              "data/mllmu_hier_confirm100/image_manifest.json",
              # 11C preregistration evidence: the power analysis that sizes
              # the confirmation split and derives the retention margin.  It
              # reads the gitignored prediction parquets and photographs, so
              # the committed JSON is the only reproducible record of the
              # sizing decision.
              "data/reports/mllmu_pilot100_confirmation_power.json",
              # The confirmation protocol freeze, written before any
              # confirmation inference.  Without it in git there is no way to
              # show the parameters were fixed beforehand.
              "data/reports/mllmu_pilot100_confirmation_freeze.json",
              # 11C stage 5: the RESULT.  Absent from git until the chain
              # scored, which was itself the record that the confirmation had
              # not been run; now the primary claims, their intervals and the
              # Holm verdict.
              "data/reports/mllmu_confirm100_final_analysis.json",
              # The provenance beside each confirmation prediction file.  The
              # three parquets are committed too, and
              # test_iteration11c5_scoring.py ties each one to the sha256 the
              # report's inputs_bound pins; these six are the JSON half, so a
              # checkout missing them fails here rather than inside a test.
              "data/mllmu_hier_confirm100/predictions/predictions_B3.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B0.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_MG.parquet.provenance.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B3.generation_order.json",
              "data/mllmu_hier_confirm100/predictions/predictions_B0.generation_order.json",
              "data/mllmu_hier_confirm100/predictions/predictions_MG.generation_order.json",
              # 11C post-run audit: what the scoring run did not record.  Filed
              # after the result was seen, marked post_hoc inside itself, and
              # binding nothing; committed so the limitation is public record.
              # The raw run logs beside it are not listed here because this step
              # json.loads every entry and they are plain text.
              "data/reports/mllmu_confirm100_execution_provenance.json",
              # Iteration 12 (exploratory).  `data/reports/*` is gitignored by
              # default, so these two need negations in .gitignore to be here
              # at all -- a frozen selection protocol that only exists in one
              # working tree is not preregistration.  The first is the fit/
              # probe partition of the retained entities; the second freezes
              # D_G's direction, its numerical tolerance and the tie-break,
              # plus the retention floor, BEFORE any candidate is trained.
              # The selection report itself is added to this list when Stage 1
              # actually runs, not before: a required file that does not exist
              # yet would fail this step on every push until then.
              "data/reports/mllmu_iter12_retention_probe.json",
              "data/reports/mllmu_iter12_selection_protocol_freeze.json",
              "data/reports/mllmu_iter12_retention_selection.json",
              "data/reports/mllmu_iter12_seed_replication_freeze.json",
              # The fit-half training groups.  retain.jsonl IS the frozen
              # partition, so the protocol's central claim -- that the probe
              # half was never rehearsed by any candidate -- is checkable from
              # a clone rather than taken on trust.
              "data/mllmu_hier_pilot100/unlearning_iter12/retain.jsonl",
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing committed reports: {missing}")
          for p in required:
              if p.endswith(".json"):
                  json.loads(Path(p).read_text())
          print(f"All {len(required)} committed reports present and valid JSON.")
          EOF
